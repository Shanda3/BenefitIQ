<span class="cite-short">
  {% for citation in citations %}
  {% if citation.status == "cited" %}
  <span>{{ citation.short }}, effective {{ citation.effective_from }}{% if citation.effective_to %} to {{ citation.effective_to }}{% endif %}</span>
  {% else %}
  <span>not found</span>
  {% endif %}
  {% else %}
  <span>not found</span>
  {% endfor %}
</span>
