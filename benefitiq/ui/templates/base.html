<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BenefitIQ{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="brand">
      <a href="/">BenefitIQ</a>
      <span>{% block tagline %}For the office manager{% endblock %}</span>
    </div>
  </header>
  <div class="banner" role="note" data-testid="decision-support-banner">
    {{ disclaimer }}
  </div>
  <main id="main">
    {% block body %}{% endblock %}
  </main>
  <footer class="foot no-print">
    {% block footer %}<a href="/advanced">Advanced</a>{% endblock %}
  </footer>
</body>
</html>
