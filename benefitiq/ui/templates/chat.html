<aside class="chat-panel" data-testid="case-chat" aria-label="Ask about this case (coming soon)">
  <div class="chat-head">
    <h2>Ask about this case (coming soon)</h2>
    <button type="button" data-chat-toggle aria-expanded="true" aria-controls="case-chat-body">Collapse</button>
  </div>
  <div id="case-chat-body">
    <p>This panel is turned off. It does not send a message.</p>
    <label for="case-chat-input">Message</label>
    <textarea id="case-chat-input" disabled aria-disabled="true" placeholder="Coming soon"></textarea>
    <button type="button" disabled aria-disabled="true">Send</button>
  </div>
</aside>
