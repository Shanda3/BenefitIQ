name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: benefitiq
          POSTGRES_PASSWORD: benefitiq
          POSTGRES_DB: benefitiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benefitiq -d benefitiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://benefitiq:benefitiq@localhost:5432/benefitiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Scan for PHI-like patterns
        run: python scripts/phi_scan.py
      - name: Run tests
        run: python -m pytest -q
